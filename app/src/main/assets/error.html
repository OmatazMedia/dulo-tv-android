<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulo TV - Connection Error</title>
    <style>
        body { 
            margin: 0; padding: 40px; 
            background: #1a1a2e; 
            color: #eee; 
            font-family: sans-serif; 
            text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; box-sizing: border-box;
        }
        h1 { font-size: 48px; margin-bottom: 20px; color: #e94560; }
        p { font-size: 24px; line-height: 1.5; max-width: 800px; }
        .retry { 
            margin-top: 40px; 
            padding: 15px 40px; 
            background: #0f3460; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-size: 24px; 
            cursor: pointer;
        }
        .retry:focus { outline: 3px solid #e94560; }
    </style>
</head>
<body>
    <h1>Unable to Load</h1>
    <p>Could not connect to <strong>dulo.gd</strong>.<br>Please check your internet connection and try again.</p>
    <button class="retry" onclick="location.reload()">Retry</button>
</body>
</html>
